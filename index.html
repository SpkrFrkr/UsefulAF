<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b14"><meta name="description" content="UsefulAF - Things &amp; Stuff - curated by SpkrFrkr.">
<title>UsefulAF // Resource Grid</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>
<header class="topbar">

  <div class="top-meta"><div class="status-line"><span class="live-dot"></span><span>DATABASE ONLINE</span><span class="record-total" id="totalCount">0 RECORDS</span></div></div>
  <button id="settingsToggle" class="settings-icon" type="button" aria-expanded="false" aria-controls="settingsPanel" aria-label="Display settings">⚙</button>
</header>
<main id="top" class="shell">
  <aside class="sidebar">
    <div class="side-title">DIRECTORY</div>
    <nav id="sheetNav" aria-label="Database categories"></nav>
    <div class="social-links" aria-label="Community links">
      <div class="social-links-heading">LINKS</div>

        <span>Filthy Casual</span><span class="social-arrow" aria-hidden="true">↗</span>
      </a>
      <a class="social-link" href="https://ko-fi.com/spkrfrkr" target="_blank" rel="noopener noreferrer" aria-label="Kofi on Ko-fi">
        <svg class="social-logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 5h15v2h2a4 4 0 0 1 0 8h-2v1a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V5Zm15 4v4h2a2 2 0 0 0 0-4h-2ZM8.3 9.1c-1.3 0-2.3 1-2.3 2.2 0 2.2 4.5 5.1 4.5 5.1s4.5-2.9 4.5-5.1c0-1.2-1-2.2-2.3-2.2-.9 0-1.7.5-2.2 1.2-.5-.7-1.3-1.2-2.2-1.2Z"/></svg>
        <span>Kofi</span><span class="social-arrow" aria-hidden="true">↗</span>
      </a>
    </div>
  </aside>
  <section class="workspace">
    <div class="hero-line"><div><h1 id="pageTitle">ALL RESOURCES</h1><p id="pageDescription" hidden></p></div><div class="hero-stats"><strong id="recordCount">0</strong><span>VISIBLE ROWS</span></div></div>
    <div class="search-row"><label class="searchbox"><span>⌕</span><input id="searchInput" type="search" placeholder="Search resources..." aria-label="Search all resources" autocomplete="off"></label></div>
    <section id="settingsPanel" class="settings" hidden>
      <button id="resetSettings" class="control-btn reset" type="button">RESET DEFAULTS</button>
      <p class="settings-note">Column widths and order are remembered on this device.</p>
    </section>
    <div class="table-shell"><div class="table-topline"><span id="tableLabel">RESOURCE TABLE</span><span> </span></div>
      <div class="table-scroll"><table id="resourceTable"><colgroup id="tableCols"></colgroup><thead><tr id="tableHead"></tr></thead><tbody id="tableBody"></tbody></table></div>
      <div id="emptyState" class="empty" hidden>NO MATCHES FOUND // TRY A DIFFERENT SEARCH TERM</div>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body></html>
